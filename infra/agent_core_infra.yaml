AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Bedrock AgentCore infrastructure, sessions/memory store, DLQ, and execution roles for FRCA"

Parameters:
  EnvironmentName:
    Type: String
    Default: "dev"
    Description: "Deployment environment identifier (e.g. dev, staging, prod)"
  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-sonnet-20240229-v1:0"
    Description: "Foundation model ID backing the Bedrock Agent"

Resources:
  # 1. Ephemeral Sessions and Long-Term Memory DynamoDB Table
  SessionsMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "frca-sessions-memory-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl_epoch
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # 2. Coordinator Dead-Letter Queue for Throttling Fail-Safe
  CoordinatorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "frca-coordinator-dlq-${EnvironmentName}"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: "alias/aws/sqs"

  # 3. Notification and Coordinator Escalation SNS Topics
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "frca-notifications-${EnvironmentName}"
      KmsMasterKeyId: "alias/aws/sns"

  CoordinatorEscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "frca-escalations-${EnvironmentName}"
      KmsMasterKeyId: "alias/aws/sns"

  # 4. IAM Execution Role for Bedrock Agent and Lambda Runtime
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-agent-execution-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SessionsMemoryTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}/index/*"
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref NotificationTopic
                  - !Ref CoordinatorEscalationTopic
        - PolicyName: SQSDeadLetterQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CoordinatorDLQ.Arn
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-agent-core-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-agent-core-*:*"

  # 4. AgentCore Runtime Lambda Function
  AgentCoreRuntimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "frca-agent-core-runtime-${EnvironmentName}"
      Handler: agent.runtime.lambda_handler
      Runtime: python3.10
      Role: !GetAtt AgentExecutionRole.Arn
      MemorySize: 512
      Timeout: 30
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              from agent.runtime import lambda_handler as handler
              return handler(event, context)
      Environment:
        Variables:
          ENVIRONMENT: !Ref EnvironmentName
          SESSIONS_MEMORY_TABLE_NAME: !Ref SessionsMemoryTable
          DONATIONS_TABLE_NAME: !Sub "frca-donations-${EnvironmentName}"
          RECIPIENTS_TABLE_NAME: !Sub "frca-recipients-${EnvironmentName}"
          VOLUNTEERS_TABLE_NAME: !Sub "frca-volunteers-${EnvironmentName}"
          MATCHES_AUDIT_TABLE_NAME: !Sub "frca-matches-audit-${EnvironmentName}"
          COORDINATOR_DLQ_URL: !Ref CoordinatorDLQ
          NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
          COORDINATOR_ESCALATION_TOPIC_ARN: !Ref CoordinatorEscalationTopic

  # 5. Scheduled EventBridge Rule for Periodic Metric Reconciliation (Every 15 min)
  ReconciliationScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "frca-reconciliation-schedule-${EnvironmentName}"
      Description: "Trigger periodic 15-minute reconciliation of session metrics"
      ScheduleExpression: "rate(15 minutes)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt AgentCoreRuntimeFunction.Arn
          Id: "ReconcileSessionMetricsTarget"
          Input: '{"detail-type": "RECONCILE_SESSION_METRICS", "source": "aws.events", "detail": {"service_region": "metro-core"}}'

  # 6. Lambda Permission for Metric Reconciliation EventBridge Invocation
  EventBridgeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentCoreRuntimeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReconciliationScheduleRule.Arn

  # 7. Scheduled EventBridge Rule for Time-Window Checks (Every 5 min)
  TimeWindowCheckScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "frca-time-window-check-${EnvironmentName}"
      Description: "Trigger periodic 5-minute check for unmatched donations approaching or past ready_by window"
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt AgentCoreRuntimeFunction.Arn
          Id: "CheckUnmatchedDonationsTarget"
          Input: '{"detail-type": "CHECK_UNMATCHED_DONATIONS", "source": "aws.events", "detail": {"service_region": "metro-core"}}'

  # 8. Lambda Permission for Time-Window Check EventBridge Invocation
  TimeWindowCheckLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentCoreRuntimeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TimeWindowCheckScheduleRule.Arn

  # 9. Dedicated IAM Role for Frontend API Gateway Proxy Lambda
  FrontendApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-frontend-api-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FrontendApiDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt SessionsMemoryTable.Arn
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-frontend-api-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-frontend-api-*:*"

  # 10. Dedicated IAM Role for Notification Tool Lambda
  NotificationToolRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-notification-tool-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref NotificationTopic
                  - !Ref CoordinatorEscalationTopic
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-notification-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-notification-*:*"

  # 11. Dedicated IAM Role for Distance Calculator Tool Lambda
  DistanceCalculatorToolRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-distance-tool-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AmazonLocationRouteAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - geo:CalculateRoute
                Resource:
                  - !Sub "arn:aws:geo:${AWS::Region}:${AWS::AccountId}:route-calculator/*"
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-distance-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-distance-*:*"

  # 12. Dedicated IAM Role for Capacity Query Tool Lambda
  CapacityQueryToolRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-capacity-tool-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RecipientCapacityReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-recipients-${EnvironmentName}/index/*"
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-capacity-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-capacity-*:*"

  # 13. Dedicated IAM Role for Volunteer Dispatch Tool Lambda
  VolunteerDispatchToolRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "frca-volunteer-tool-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VolunteerAssignmentAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-volunteers-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-donations-${EnvironmentName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/frca-matches-audit-${EnvironmentName}/index/*"
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-volunteer-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/frca-volunteer-*:*"

  # 14. CloudWatch Metric Filter for Security Auth Violations
  AuthViolationMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/frca-frontend-api-${EnvironmentName}"
      FilterPattern: '"AUTH_VIOLATION"'
      MetricTransformations:
        - MetricNamespace: "FRCA/Security"
          MetricName: "AuthViolationCount"
          MetricValue: "1"

  # 15. CloudWatch Monitoring Dashboard
  CloudWatchMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "frca-operational-dashboard-${EnvironmentName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "frca-agent-core-runtime-${EnvironmentName}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Throttles", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Invocations, Errors & Throttles"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "frca-agent-core-runtime-${EnvironmentName}", { "stat": "Average" } ],
                  [ "...", { "stat": "p90" } ],
                  [ "...", { "stat": "p99" } ]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "title": "Lambda Latency Percentiles (p90, p99)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "frca-coordinator-dlq-${EnvironmentName}" ]
                ],
                "period": 60,
                "stat": "Maximum",
                "region": "${AWS::Region}",
                "title": "Coordinator Dead-Letter Queue Depth"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "frca-donations-${EnvironmentName}" ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", "." ],
                  [ ".", "ConsumedReadCapacityUnits", "TableName", "frca-sessions-memory-${EnvironmentName}" ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "DynamoDB Consumed Capacity Units (RCU/WCU)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ReadThrottleEvents", "TableName", "frca-donations-${EnvironmentName}" ],
                  [ ".", "WriteThrottleEvents", ".", "." ],
                  [ ".", "ReadThrottleEvents", "TableName", "frca-sessions-memory-${EnvironmentName}" ],
                  [ ".", "WriteThrottleEvents", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "DynamoDB Read/Write Throttle Events"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "FRCA/Security", "AuthViolationCount" ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Security Auth Violations"
              }
            }
          ]
        }

  # 16. CloudWatch Alarm for DLQ Non-Empty
  DLQMessagesVisibleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "frca-dlq-messages-visible-${EnvironmentName}"
      AlarmDescription: "Alerts when Coordinator Dead-Letter Queue has visible messages"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CoordinatorDLQ.QueueName
      AlarmActions:
        - !Ref CoordinatorEscalationTopic

  # 17. CloudWatch Alarm for Runtime Errors
  RuntimeErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "frca-runtime-error-rate-${EnvironmentName}"
      AlarmDescription: "Alerts when AgentCore Runtime Lambda encounters execution errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentCoreRuntimeFunction
      AlarmActions:
        - !Ref CoordinatorEscalationTopic

  # 18. CloudWatch Alarm for Auth Violation Surges
  AuthViolationSurgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "frca-auth-violation-surge-${EnvironmentName}"
      AlarmDescription: "Alerts when unauthorized access attempts surge (>= 5 in 5 minutes)"
      MetricName: AuthViolationCount
      Namespace: "FRCA/Security"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref CoordinatorEscalationTopic

Outputs:
  SessionsMemoryTableName:
    Description: "Name of the DynamoDB table for ephemeral sessions and long-term memory"
    Value: !Ref SessionsMemoryTable
    Export:
      Name: !Sub "${AWS::StackName}-SessionsMemoryTableName"

  CoordinatorDLQUrl:
    Description: "URL of the SQS Dead-Letter Queue for throttled requests"
    Value: !Ref CoordinatorDLQ
    Export:
      Name: !Sub "${AWS::StackName}-CoordinatorDLQUrl"

  NotificationTopicArn:
    Description: "ARN of the Amazon SNS topic for transactional notifications"
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub "${AWS::StackName}-NotificationTopicArn"

  CoordinatorEscalationTopicArn:
    Description: "ARN of the Amazon SNS topic for coordinator escalations"
    Value: !Ref CoordinatorEscalationTopic
    Export:
      Name: !Sub "${AWS::StackName}-CoordinatorEscalationTopicArn"

  AgentExecutionRoleArn:
    Description: "ARN of the IAM Role for Bedrock Agent and Lambda execution"
    Value: !GetAtt AgentExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgentExecutionRoleArn"

  AgentCoreRuntimeFunctionArn:
    Description: "ARN of the AgentCore Runtime Lambda function"
    Value: !GetAtt AgentCoreRuntimeFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgentCoreRuntimeFunctionArn"

  FrontendApiRoleArn:
    Description: "ARN of the IAM Role for Frontend API Gateway Proxy Lambda"
    Value: !GetAtt FrontendApiRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FrontendApiRoleArn"

  NotificationToolRoleArn:
    Description: "ARN of the IAM Role for Notification Tool Lambda"
    Value: !GetAtt NotificationToolRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NotificationToolRoleArn"

  DistanceCalculatorToolRoleArn:
    Description: "ARN of the IAM Role for Distance Calculator Tool Lambda"
    Value: !GetAtt DistanceCalculatorToolRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DistanceCalculatorToolRoleArn"

  CapacityQueryToolRoleArn:
    Description: "ARN of the IAM Role for Capacity Query Tool Lambda"
    Value: !GetAtt CapacityQueryToolRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CapacityQueryToolRoleArn"

  VolunteerDispatchToolRoleArn:
    Description: "ARN of the IAM Role for Volunteer Dispatch Tool Lambda"
    Value: !GetAtt VolunteerDispatchToolRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VolunteerDispatchToolRoleArn"

  CloudWatchMonitoringDashboardName:
    Description: "Name of the CloudWatch Operational Monitoring Dashboard"
    Value: !Ref CloudWatchMonitoringDashboard
    Export:
      Name: !Sub "${AWS::StackName}-CloudWatchMonitoringDashboardName"

